<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="1%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  <!-- Prescription Paper -->
  <rect x="15" y="15" width="470" height="650" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#paper-shadow)"/>
  
  <!-- Clinic Header -->
  <path d="M 15 25 Q 15 15 25 15 L 475 15 Q 485 15 485 25 L 485 95 L 15 95 Z" fill="url(#header-grad)" />
  <circle cx="50" cy="55" r="22" fill="#ffffff" opacity="0.95"/>
  <text x="50" y="62" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="24" fill="#0284c7" text-anchor="middle">Rx</text>
  <text x="85" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="17" fill="#ffffff">CITY CARE MULTISPECIALTY CLINIC</text>
  <text x="85" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0f2fe">Dr. S. K. Sharma, MBBS, MD (Internal Med) | Reg No: 88472-A</text>
  <text x="85" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#bae6fd">Ph: +91 98234-XXXXX | 402 Health Avenue, Metro City</text>

  <!-- Patient Metadata Bar -->
  <rect x="35" y="110" width="430" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="45" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">Patient: <tspan fill="#0f172a" font-weight="600">Rahul Verma (29 M)</tspan></text>
  <text x="250" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">Date: <tspan fill="#0f172a" font-weight="600">18-Sep-2026</tspan></text>
  <text x="45" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">Diagnosis: <tspan fill="#0284c7" font-weight="600">Acute Bacterial Pharyngitis &amp; Bronchitis</tspan></text>
  <text x="360" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">Weight: <tspan fill="#0f172a" font-weight="600">71 kg</tspan></text>

  <!-- Rx Watermark / Symbol -->
  <text x="50" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#0284c7" opacity="0.8">℞</text>
  <line x1="45" y1="215" x2="455" y2="215" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Handwritten-style Medical Scribbles (Cursive-look) -->
  <!-- Medicine 1: Augmentin -->
  <text x="65" y="250" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="20" fill="#1e293b">1. Tab. Augmentin 625 mg</text>
  <text x="90" y="275" font-family="'Segoe UI', sans-serif" font-size="12" fill="#475569">-> 1 - 0 - 1 (Twice daily, after meals) x 5 days</text>

  <!-- Medicine 2: Pan-D -->
  <text x="65" y="320" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="20" fill="#1e293b">2. Cap. Pan - D 40mg</text>
  <text x="90" y="345" font-family="'Segoe UI', sans-serif" font-size="12" fill="#475569">-> 1 - 0 - 0 (Empty stomach, early morning) x 5 days</text>

  <!-- Medicine 3: Dolo 650 -->
  <text x="65" y="390" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="20" fill="#1e293b">3. Tab. Dolo 650 mg</text>
  <text x="90" y="415" font-family="'Segoe UI', sans-serif" font-size="12" fill="#475569">-> 1 tab SOS for fever/pain (max 3 tabs/day) x 3 days</text>

  <!-- Medicine 4: Levocet-M -->
  <text x="65" y="460" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="20" fill="#1e293b">4. Tab. Levocet - M</text>
  <text x="90" y="485" font-family="'Segoe UI', sans-serif" font-size="12" fill="#475569">-> 0 - 0 - 1 (At night before bed) x 5 days</text>

  <!-- Advice Notes -->
  <rect x="45" y="525" width="410" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="55" y="545" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#166534">Doctor's Advice:</text>
  <text x="55" y="562" font-family="'Segoe UI', sans-serif" font-size="11" fill="#15803d">• Warm saline gargles thrice daily. Drink plenty of warm water.</text>
  <text x="55" y="576" font-family="'Segoe UI', sans-serif" font-size="11" fill="#15803d">• Complete the full 5-day antibiotic course. Review after 5 days.</text>

  <!-- Signature Stamp -->
  <line x1="330" y1="630" x2="445" y2="630" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 345 615 Q 365 595 385 625 T 425 615" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <text x="387" y="643" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Doctor's Signature &amp; Stamp</text>
</svg>
